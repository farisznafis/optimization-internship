# Task-assignment solver settings (optim task-assignment --config <this file>)

# Maximum story points one employee can take
MAX_EMPLOYEE_WORKLOAD: 10

# Gurobi parameters
PRESOLVE: 2        # aggressive presolve
MIPFOCUS: 1        # focus on finding feasible solutions
MIPGAP: 0.01       # optimality gap for objectives 1-3
HEURISTICS: 0.8
THREADS: 2         # adjust to your CPU
MIPGAP_MOO: 0.05   # optimality gap for the multi-objective solve
TIME_LIMIT: null   # seconds per solve, null = no limit

# Goal-programming weights (objective 1: idle employees, 2: assessment score, 3: workload balance)
WEIGHT_OBJ1: 0.03
WEIGHT_OBJ2: 0.9
WEIGHT_OBJ3: 0.07

# true = Competency Assessment (MSG), false = Weighted Euclidean Distance
OVERQUALIFICATION: true

# Send progress messages to the Discord webhook in DISCORD_URL
DISCORD: false
